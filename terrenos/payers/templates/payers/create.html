{% extends "base.html" %}

{% block content %}
<div class="container">
  <div class="card">
    <div class="card-header">
      <h5 class="card-title">Crear un Pagador</h5>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="row mb-3">
          <div class="col-md-12">
            <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
            {{ form.name }}
            {% if form.name.errors %}
              <div class="text-danger">{{ form.name.errors }}</div>
            {% endif %}
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-12">
            <label for="{{ form.notes.id_for_label }}" class="form-label">{{ form.notes.label }}</label>
            {{ form.notes }}
            {% if form.notes.errors %}
                <div class="text-danger">{{ form.notes.errors }}</div>
            {% endif %}
          </div>
        </div>
  
        <button type="submit" class="btn btn-primary">Crear</button>
        <a href="{% url 'payers:index' %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
